# Secret：敏感信息。按"谁需要什么"拆成三份，最小权限原则——
# 一个大而全的 Secret 挂给所有 Pod，等于把数据库 root 密码发给网关，
# 简历项目里这就是面试官会抓的安全细节。
#
#   db-credentials : MYSQL_USER / MYSQL_PASSWORD —— user/product/seed/mysql(初始化建号)
#   jwt-secret     : JWT_SECRET —— 只有签发方(user)和校验方(gateway)需要
#   mysql-root     : MYSQL_ROOT_PASSWORD —— 只有 mysql 容器自己需要
#
# 注意：stringData 里的值仍然是开发环境的明文（base64 不是加密，只是编码），
# 真正的生产做法是 sealed-secrets / external-secrets / 云 KMS，绝不进 Git。
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ecom
type: Opaque
stringData:
  MYSQL_USER: "ecom"
  MYSQL_PASSWORD: "ecom123"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ecom
type: Opaque
stringData:
  JWT_SECRET: "dev-only-change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-root
  namespace: ecom
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
