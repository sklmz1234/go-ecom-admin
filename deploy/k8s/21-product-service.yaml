# product-service：与 user-service 结构完全对称（讲解范本见 20-user-service.yaml），
# 差异只有：端口 9002、不需要 jwt-secret（它不签发 token）。
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecom
spec:
  selector:
    app: product-service
  ports:
    - name: grpc
      port: 9002
      targetPort: 9002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecom
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: go-ecom-admin/product-service
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: db-credentials }
          ports:
            - name: grpc
              containerPort: 9002
          readinessProbe:
            grpc:
              port: 9002
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 9002
            initialDelaySeconds: 10
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      terminationGracePeriodSeconds: 30
