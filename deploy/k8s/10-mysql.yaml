# MySQL：StatefulSet + PVC。
#
# 为什么不用 Deployment？数据库有状态（数据卷绑定、稳定的网络标识），
# StatefulSet 保证 Pod 重建后挂回同一块 PVC，数据还在——对应 compose 里的
# volumes: mysql-data。生产环境通常直接用云 RDS，在 K8s 里跑数据库
# 属于学习/自建场景，这一点面试时要能主动说清取舍。
#
# 为什么只有 readinessProbe 没有 livenessProbe？数据库初始化慢
# （建库建账号建表），liveness 失误会引发"重启风暴"：还没起来就被杀，
# 越杀越起不来。对有状态服务，readiness（暂时不接流量）比 liveness
# （杀掉重来）是更安全的失败处理。
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ecom
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ecom
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          # 和 compose 阶段保持一致：容器时区 + MySQL 时区都要设，
          # 否则时间戳差 8 小时（GORM DSN 的 loc=Local 依赖容器 TZ）。
          args: ["--default-time-zone=+08:00"]
          env:
            - name: TZ
              value: Asia/Shanghai
            # 下面四个 = mysql 镜像首次初始化行为：建库、建业务账号。
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-root, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: app-config, key: MYSQL_DB_NAME }
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: MYSQL_PASSWORD }
          ports:
            - name: mysql
              containerPort: 3306
          # 和 compose 的 healthcheck 同款：用 root 真正执行一次 SQL，
          # 而不是 mysqladmin ping——保证 ready = 初始化全部完成，
          # user/product 的 AutoMigrate 才不会踩空。
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -h127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1' --silent"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30 # 首次初始化可能较慢，给足重试次数
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
  # volumeClaimTemplates：PVC 由 StatefulSet 自动创建管理。
  # kubectl delete -f 时 PVC 不会随之删除——数据在集群重装 manifests 后仍在，
  # 但重置整个集群（改版本/节点数）会连 PVC 一起清空，测试数据用 seed 重建。
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
