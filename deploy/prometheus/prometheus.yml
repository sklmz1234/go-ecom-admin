# Prometheus 抓取配置（阶段 2D 下半程）：pull 模式的"拉"端。
# 三个 target 对应三个 /metrics 端点：
#   网关复用业务端口 8080，两个 gRPC 服务走独立运维端口 9464。
global:
  # 5s 是本地开发取向：事故重演（停 MySQL）时错误率曲线要"立即"飙升，
  # 生产常见 15s~30s——间隔越短，时间序列存储压力越大。
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: user-service
    static_configs:
      - targets: ["user-service:9464"]
  - job_name: product-service
    static_configs:
      - targets: ["product-service:9464"]
