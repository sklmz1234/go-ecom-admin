# go-ecom-admin 本地编排：MySQL + 2 个 gRPC 服务 + 1 个 HTTP 网关。
# 前置：cp .env.example .env（compose 自动读取同目录 .env 做变量替换）。
name: go-ecom-admin

# Go 服务共用的 MySQL 连接环境变量。
# Viper AutomaticEnv（pkg/config）用它们覆盖 configs/config.yaml 里的
# 127.0.0.1 默认值——容器内的 127.0.0.1 指向容器自己，必须换成 service 名。
x-mysql-env: &mysql-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: ${MYSQL_USER:-ecom}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecom123}
  MYSQL_DB_NAME: ${MYSQL_DB_NAME:-ecom_admin}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB_NAME:-ecom_admin}
      # 业务专用账号（mysql 镜像首次初始化时自动创建并授权），
      # 应用不拿 root 连库是基本规范。
      MYSQL_USER: ${MYSQL_USER:-ecom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecom123}
      TZ: Asia/Shanghai
    # 和 Go 服务容器的 TZ 保持一致，时间戳才不会差 8 小时
    # 和 Go 服务一致的自愈策略：Docker daemon 重启后所有容器被并行拉起，
    # 基础设施容器不写 restart 就会永远躺着（2026-09-07 实测：Docker Desktop
    # 重启后 MySQL/Redis 没人拉，两个业务服务连不上库陷入崩溃循环，
    # 前端 internal error）。注意：depends_on 的健康检查门槛只在
    # `docker compose up` 编排时生效，daemon 重启后的自动拉起不走依赖顺序，
    # 所以应用层还有 pkg/database.ConnectWithRetry 做第二道防线。
    restart: unless-stopped
    command: --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      # 用 root 真正执行一次 SQL 而不是 mysqladmin ping：
      # 首次初始化期间（root 密码还没设好）登录会失败，
      # 这样保证 healthy = 建库建账号全部完成，下游服务连进来不会踩空。
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    image: go-ecom-admin/user-service:${TAG:-latest}
    environment:
      <<: *mysql-env
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production}
      TELEMETRY_OTLP_ENDPOINT: jaeger:4317
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    image: go-ecom-admin/product-service:${TAG:-latest}
    environment:
      <<: *mysql-env
      # 缓存地址，覆盖 config.yaml 里的 127.0.0.1:6379
      REDIS_ADDR: redis:6379
      TELEMETRY_OTLP_ENDPOINT: jaeger:4317
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 阶段 3：订单服务。与 user/product 同一套对称结构：
  # mysql-env 复用、telemetry 指向 compose 内的 Jaeger、依赖 MySQL 健康后启动。
  # 注意它不依赖 Redis——订单没有读缓存层（写多、按人隔离，缓存收益低）。
  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    image: go-ecom-admin/order-service:${TAG:-latest}
    environment:
      <<: *mysql-env
      # order-service 是 gRPC 客户端（调 product-service 扣库存），
      # 容器网络内用 service 名寻址。
      GRPC_CLIENT_PRODUCT_SERVICE_ADDR: product-service:9002
      TELEMETRY_OTLP_ENDPOINT: jaeger:4317
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      product-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    image: go-ecom-admin/api-gateway:${TAG:-latest}
    environment:
      # 容器网络内用 service 名寻址，替代 yaml 里的 127.0.0.1
      GRPC_CLIENT_USER_SERVICE_ADDR: user-service:9001
      GRPC_CLIENT_PRODUCT_SERVICE_ADDR: product-service:9002
      GRPC_CLIENT_ORDER_SERVICE_ADDR: order-service:9003
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production}
      TELEMETRY_OTLP_ENDPOINT: jaeger:4317
      TZ: Asia/Shanghai
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped

  # 种子工具：不随 make up 启动（profiles 隔离），用 make seed 手动执行
  seed:
    build:
      context: .
      args:
        SERVICE: seed
    image: go-ecom-admin/seed:${TAG:-latest}
    profiles: ["tools"]
    environment:
      <<: *mysql-env
      # seed 重置库表后要清商品读缓存（否则旧缓存里的数据没有 owner_id，
      # 归属校验会误判 403），所以需要 Redis 地址。
      REDIS_ADDR: redis:6379
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # product-service 读缓存（阶段 2C）。不暴露宿主机端口——只有容器网络内的
  # product-service 需要连它，攻击面最小化（和 K8s 里不给 gateway 挂 db 凭证同理）。
  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Shanghai
    command: redis-server --appendonly yes
    # 同 mysql：daemon 重启后自愈，理由见上方 mysql 服务的注释。
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 链路追踪后端（阶段 2D）。all-in-one 单容器包含 collector + 存储（内存）
  # + UI，是本地开发的标配形态；生产要拆 all-in-one（Jaeger v2 起官方也建议
  # 生产用 jaeger collector + ES/Cassandra 后端独立部署），内存存储重启即丢
  # ——本地这无所谓，反而省得清数据。
  # 4317 (OTLP gRPC) 同时映射到宿主机：服务在容器网络内走 jaeger:4317，
  # 宿主机裸 go run 的进程走 127.0.0.1:4317（config.yaml 默认值）。
  # UI 在 http://localhost:16686。
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "4317:4317"
    restart: unless-stopped

  # 指标后端（阶段 2D 下半程）：pull 模式，每 5s 主动抓三个服务的
  # /metrics 端点（网关 :8080，两个 gRPC 服务 :9464）。本地不挂数据卷，
  # 时间序列随容器删——和 Jaeger 内存存储同一个取舍。
  prometheus:
    image: prom/prometheus:v3.5.0
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROM_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  # 面板层：provisioning 自动配好 Prometheus/Jaeger 数据源并加载
  # deploy/grafana/provisioning/dashboards/ 下的面板 JSON，容器起来即开箱。
  # 默认账号 admin / admin（GF_SECURITY_ADMIN_PASSWORD 可在 .env 覆盖）。
  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
